name: SecureAgent checks
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26.x", cache-dependency-path: gateway/go.sum}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: runtime/requirements.txt}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: dashboard/package-lock.json}
      - run: go test -race ./... && go vet ./...
        working-directory: gateway
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        working-directory: gateway
      - run: pip install -r runtime/requirements.txt
      - run: pip install pip-audit && python -m pip_audit -r runtime/requirements.txt
      - run: python -m pytest -q
        working-directory: runtime
      - run: npm ci && npm run build
        working-directory: dashboard
      - run: npm audit --audit-level=moderate
        working-directory: dashboard
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r runtime/requirements.txt
      - run: python scripts/setup_env.py
      - run: docker compose up --build -d
      - name: Wait for browser facade
        run: |
          for i in $(seq 1 90); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/v1/me)" = "401" ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: python scripts/demo.py
      - name: Database and queue boundaries
        run: docker compose --profile test run --rm verify
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
